name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  database:
    name: Database migrations & RLS tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Run SQL security tests
        run: ./db/tests/run.sh
      - name: PREPARE-check every SQL statement in backend
        run: python3 backend/scripts/check_sql.py "dbname=pos_rls_test host=localhost user=postgres password=postgres"

  backend:
    name: Backend build & integration tests
    runs-on: ubuntu-latest
    needs: database
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pos_it
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Test
        working-directory: backend
        env:
          POS_TEST_DB_URL: jdbc:postgresql://localhost:5432/pos_it
          POS_TEST_DB_OWNER: postgres
          POS_TEST_DB_OWNER_PASSWORD: postgres
        run: ./gradlew --no-daemon test bootJar
      - name: Report failed tests as annotations
        if: failure()
        working-directory: backend
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          n = 0
          for f in glob.glob('build/test-results/test/*.xml'):
              for case in ET.parse(f).getroot().iter('testcase'):
                  for bad in list(case.findall('failure')) + list(case.findall('error')):
                      msg = (bad.get('message') or '').replace('\n', ' ').replace('%', '%25')[:600]
                      text = (bad.text or '')
                      cause = [l.strip() for l in text.splitlines() if 'Caused by' in l or 'ERROR:' in l][:3]
                      detail = ' | '.join(cause).replace('%', '%25')[:600]
                      print(f"::error title={case.get('classname').split('.')[-1]}.{case.get('name')}::{msg} {detail}")
                      n += 1
          print(f"{n} failing test(s)")
          PY
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test

  frontend:
    name: Frontend lint, type-check, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run type-check
          npm run test
          npm run build
