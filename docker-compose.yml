# Lingkungan LOKAL lengkap: PostgreSQL + backend (profile local, shim auth) + frontend.
# Untuk staging/production gunakan Supabase; lihat docs/DEPLOYMENT.md.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes: [pos-db:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    depends_on: { db: { condition: service_healthy } }
    environment:
      SPRING_PROFILES_ACTIVE: local
      DATABASE_URL: jdbc:postgresql://db:5432/pos
      DATABASE_USERNAME: pos_api
      DATABASE_PASSWORD: pos_api_local_only
      MIGRATION_DATABASE_USERNAME: postgres
      MIGRATION_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POS_CORS_ALLOWED_ORIGINS: http://localhost:8081
    ports: ["8080:8080"]

  frontend:
    build:
      context: ./frontend
      args: { VITE_AUTH_MODE: local }
    depends_on: [backend]
    ports: ["8081:80"]

volumes:
  pos-db:
